<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iron Support</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f10;
        --panel: #12191b;
        --border: #253036;
        --text: #f5f7f7;
        --muted: #97a7ad;
        --accent: #63d24b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        line-height: 1.6;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 20px 72px;
      }

      h1,
      h2 {
        margin: 0 0 12px;
        font-weight: 600;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        font-size: 15px;
        color: var(--accent);
        text-transform: lowercase;
      }

      p {
        font-size: 14px;
        color: var(--text);
      }

      .muted {
        color: var(--muted);
      }

      section {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 6px;
        padding: 16px;
        margin-top: 16px;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="muted">iron</p>
      <h1>Support</h1>
      <p class="muted">App support and store contact</p>

      <section>
        <h2>contact</h2>
        <p>Support email: <a href="mailto:jdardini@gmail.com">jdardini@gmail.com</a></p>
      </section>

      <section>
        <h2>scope</h2>
        <p>This contact is intended for app support, privacy-policy contact, and store-submission support details.</p>
      </section>
    </main>
  </body>
</html>
